<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neli Studio</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { color: #ffffff; margin-bottom: 5px; }
    p { color: #b3b3b3; margin-top: 0; }
    .controls {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      text-align: center;
      width: 300px;
    }
    input[type="file"] {
      color: #ffffff;
      margin-bottom: 20px;
    }
    .effect-group {
      margin-top: 20px;
      text-align: left;
    }
    label { display: block; color: #b3b3b3; margin-bottom: 5px; font-size: 14px; }
    input[type="range"] { width: 100%; }
    audio {
      width: 100%;
      filter: invert(100%) hue-rotate(180deg);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Neli Studio</h1>
  <p>Music studio web application.</p>
  <div class="controls">
    <input type="file" id="audioUpload" accept="audio/*">
    
    <div class="effect-group">
      <label for="pitchShift">Pitch Shift (Semitones)</label>
      <input type="range" id="pitchShift" min="-12" max="12" value="0" step="1">
    </div>

    <audio id="audioPlayer" controls></audio>
  </div>
  <script>
    const audioInput = document.getElementById('audioUpload');
    const audioPlayer = document.getElementById('audioPlayer');
    const pitchInput = document.getElementById('pitchShift');

    let audioCtx;
    let sourceNode;
    let playbackRate = 1.0;

    audioInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        audioPlayer.src = url;
      }
    });

    audioPlayer.onplay = () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        sourceNode = audioCtx.createMediaElementSource(audioPlayer);
        sourceNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    };

    pitchInput.addEventListener('input', function() {
      const semitones = parseFloat(this.value);
      playbackRate = Math.pow(2, semitones / 12);
      audioPlayer.playbackRate = playbackRate;
    });
  </script>
</body>
</html>
