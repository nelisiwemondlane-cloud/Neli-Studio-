<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neli Studio - Working Suite</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    h1 { margin-bottom: 5px; }
    h3 { margin-top: 0; color: #00e676; }
    input[type="file"], input[type="range"] {
      width: 100%;
      margin: 10px 0;
    }
    label { display: block; font-size: 14px; color: #b3b3b3; }
    audio { width: 100%; margin-top: 15px; }
    .status { font-size: 12px; color: #888; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <h1>Neli Studio</h1>
  
  <div class="container">
    <h3>Vocal Processor</h3>
    <input type="file" id="audioUpload" accept="audio/*">
    
    <label for="pitchShift">Pitch Shift (Semitones)</label>
    <input type="range" id="pitchShift" min="-12" max="12" value="0" step="1">
    
    <audio id="audioPlayer" controls></audio>
    <div id="status" class="status">Upload an audio file to begin</div>
  </div>

  <script>
    const audioInput = document.getElementById('audioUpload');
    const audioPlayer = document.getElementById('audioPlayer');
    const pitchInput = document.getElementById('pitchShift');
    const statusDiv = document.getElementById('status');

    let player, pitchShifter;

    audioInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusDiv.innerText = "Loading file...";
      const url = URL.createObjectURL(file);
      audioPlayer.src = url;

      await Tone.start();

      if (player) {
        player.dispose();
      }
      if (pitchShifter) {
        pitchShifter.dispose();
      }

      player = new Tone.Player(url);
      pitchShifter = new Tone.PitchShift(0).toDestination();
      
      player.connect(pitchShifter);
      statusDiv.innerText = "Ready to play";

      audioPlayer.onplay = async () => {
        await Tone.start();
        player.start();
        statusDiv.innerText = "Playing with Pitch Shift";
      };

      audioPlayer.onpause = () => {
        if (player.state === 'started') {
          player.stop();
        }
        statusDiv.innerText = "Paused";
      };
      
      audioPlayer.onended = () => {
        statusDiv.innerText = "Playback finished";
      };
    });

    pitchInput.addEventListener('input', (e) => {
      const semitones = parseFloat(e.target.value);
      if (pitchShifter) {
        pitchShifter.pitch = semitones;
      }
      statusDiv.innerText = `Pitch Shift: ${semitones} semitones`;
    });
  </script>
</body>
</html>
