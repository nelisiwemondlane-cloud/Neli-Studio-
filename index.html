<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neli Studio - Complete Suite</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #121212;
color: #e0e0e0;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
margin: 0;
padding: 20px;
}
h1 { color: #ffffff; margin-bottom: 5px; }
p { color: #b3b3b3; margin-top: 0; }
.studio-container {
background-color: #1e1e1e;
padding: 25px;
border-radius: 12px;
box-shadow: 0 4px 20px rgba(0,0,0,0.5);
width: 100%;
max-width: 400px;
margin-bottom: 20px;
}
.section-title {
color: #00e676;
font-size: 16px;
border-bottom: 1px solid #333;
padding-bottom: 5px;
margin-top: 15px;
margin-bottom: 10px;
}
input[type="file"] { color: #ffffff; margin-bottom: 10px; width: 100%; }
.control-group { margin-bottom: 15px; }
label { display: block; color: #b3b3b3; margin-bottom: 5px; font-size: 14px; }
input[type="range"] { width: 100%; accent-color: #00e676; }
audio {
width: 100%;
filter: invert(100%) hue-rotate(180deg);
margin-top: 10px;
}
button {
background-color: #00e676;
border: none;
color: #121212;
padding: 10px 20px;
font-size: 16px;
font-weight: bold;
border-radius: 6px;
cursor: pointer;
width: 100%;
transition: background 0.2s;
}
button:hover { background-color: #00b953; }
.status { font-size: 12px; color: #888; margin-top: 5px; }
</style>
</head>
<body>
<h1>Neli Studio</h1>
<p>Professional Browser Audio Suite</p>
​<div class="studio-container">
<div class="section-title">1. Vocal Processing</div>
<input type="file" id="audioUpload" accept="audio/*">
<div class="control-group">
<label for="pitchShift">Pitch Shift (Semitones)</label>
<input type="range" id="pitchShift" min="-12" max="12" value="0" step="1">
</div>
<audio id="audioPlayer" controls></audio>
<div id="vocalStatus" class="status">Upload vocals to enable processing</div>
</div>
​<div class="studio-container">
<div class="section-title">2. Rhythm Section</div>
<button id="beatsToggle">Start Beat Generator</button>
<div class="control-group" style="margin-top: 15px;">
<label for="tempo">Tempo (BPM)</label>
<input type="range" id="tempo" min="60" max="180" value="120">
</div>
<div id="beatStatus" class="status">Click to start backing track</div>
</div>
​<script>
// --- Vocal Processing Logic ---
const audioInput = document.getElementById('audioUpload');
const audioPlayer = document.getElementById('audioPlayer');
const pitchInput = document.getElementById('pitchShift');
const vocalStatus = document.getElementById('vocalStatus');
​let audioCtx;
let sourceNode;
​audioInput.addEventListener('change', function(e) {
const file = e.target.files[0];
if (file) {
vocalStatus.innerText = "Loaded: " + file.name;
const url = URL.createObjectURL(file);
audioPlayer.src = url;
}
});
​audioPlayer.onplay = () => {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
sourceNode = audioCtx.createMediaElementSource(audioPlayer);
sourceNode.connect(audioCtx.destination);
}
if (audioCtx.state === 'suspended') {
audioCtx.resume();
}
vocalStatus.innerText = "Playing & Processing...";
};
​pitchInput.addEventListener('input', function() {
const semitones = parseFloat(this.value);
audioPlayer.playbackRate = Math.pow(2, semitones / 12);
vocalStatus.innerText = "Pitch Shift: " + semitones + " st";
});
​// --- Beat Generation Logic (Tone.js) ---
const beatsToggle = document.getElementById('beatsToggle');
const tempoInput = document.getElementById('tempo');
const beatStatus = document.getElementById('beatStatus');
let isPlayingBeats = false;
let loop;
​// Synth for basic kick/snare generation
const kick = new Tone.MembraneSynth().toDestination();
const snare = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.005, decay: 0.1, sustain: 0 } }).toDestination();
​// Basic 4/4 Pattern
const pattern = ["C1", null, "E1", null, "C1", null, "E1", null];
let step = 0;
​beatsToggle.addEventListener('click', async () => {
await Tone.start();
​if (!isPlayingBeats) {
Tone.Transport.bpm.value = tempoInput.value;
loop = new Tone.Loop((time) => {
const note = pattern[step];
if (note === "C1") kick.triggerAttackRelease("C1", "8n", time);
if (note === "E1") snare.triggerAttackRelease("8n", time);
step = (step + 1) % pattern.length;
}, "8n").start(0);
​Tone.Transport.start();
beatsToggle.innerText = "Stop Beat Generator";
beatStatus.innerText = "Beats Running";
isPlayingBeats = true;
} else {
Tone.Transport.stop();
if(loop) loop.dispose();
beatsToggle.innerText = "Start Beat Generator";
beatStatus.innerText = "Beats Stopped";
isPlayingBeats = false;
}
});
​tempoInput.addEventListener('input', function() {
Tone.Transport.bpm.value = this.value;
});
</script>
</body>
</html>
